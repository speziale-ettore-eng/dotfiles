[cli]
installer = "internal"
channel = "stable"

[marketplace]
default_skills_installs_purged = true

[ui]
permission_mode = "ask"
remember_tool_approvals = true

[permission]
allow = [
  # Status reads + failed-job retrigger only. Other gh commands still prompt in
  # ask mode.
  "Edit(**/.grok/plugin-data/pr-monitor/**)",
  "Read(**/.grok/plugin-data/pr-monitor/**)",
  "Bash(gh auth status*)",
  "Bash(gh repo view *)",
  "Bash(gh pr view *)",
  "Bash(gh pr checks *)",
  "Bash(gh run view *)",
  "Bash(gh run list *)",
  "Bash(gh api graphql *)",
  "Bash(gh run rerun )",
]
