[cli]
installer = "internal"
channel = "stable"

[marketplace]
default_skills_installs_purged = true

[ui]
permission_mode = "ask"
remember_tool_approvals = true

[permission]
allow = [
  # Status reads + failed-job retrigger only. Other gh commands still prompt in
  # ask mode.
  "Edit(**/.grok/plugin-data/pr-monitor/**)",
  "Read(**/.grok/plugin-data/pr-monitor/**)",
  "Bash(gh auth status*)",
  "Bash(gh repo view *)",
  "Bash(gh pr view *)",
  "Bash(gh pr checks *)",
  "Bash(gh run view *)",
  "Bash(gh run list *)",
  "Bash(gh api graphql *)",
  "Bash(gh run rerun * --failed)",
  "Bash(GH_HOST=* gh auth status*)",
  "Bash(GH_HOST=* gh repo view *)",
  "Bash(GH_HOST=* gh pr view *)",
  "Bash(GH_HOST=* gh pr checks *)",
  "Bash(GH_HOST=* gh run view *)",
  "Bash(GH_HOST=* gh run list *)",
  "Bash(GH_HOST=* gh api graphql *)",
  "Bash(GH_HOST=* gh run rerun * --failed)",
  "Bash(NO_COLOR=* gh api graphql *)",
  "Bash(NO_COLOR=* GH_HOST=* gh api graphql *)",
  "Bash(GH_HOST=* NO_COLOR=* gh api graphql *)",
]
